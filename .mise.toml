[tools]
# Keep major-only version so `mise install` always picks the latest patch.
# Node.js is only used for running tests, so minor/patch precision is unnecessary.
node = "24"
pnpm = "10.28.2"
lefthook = "2.1.0"

# lefthook hooks
actionlint = "1.7.10"
"github:fohte/basefmt" = "0.1.0"
shellcheck = "0.11.0"
shfmt = "3.12.0"
