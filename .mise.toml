[tools]
# Keep major-only version so `mise install` always picks the latest patch.
# Pinning to an exact version (e.g., "24.13.1") would generate frequent
# Renovate PRs for every patch release with little benefit.
node = "24"
pnpm = "10.27.0"
lefthook = "2.0.16"

# lefthook hooks
actionlint = "1.7.10"
"cargo:basefmt" = "0.1.0"
shellcheck = "0.11.0"
shfmt = "3.12.0"
