name: Sync generic-boilerplate

on:
  push:
    branches:
      - 'renovate/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v3

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Sync generic-boilerplate packages
        run: pnpm sync:generic-boilerplate

      - name: Commit changes
        uses: suzuki-shunsuke/commit-action@v0.0.14
        with:
          commit_message: 'chore: sync generic-boilerplate package list'
          workflow: deny
          github_token: ${{ steps.app-token.outputs.token }}
